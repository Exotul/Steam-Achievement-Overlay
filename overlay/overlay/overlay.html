<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
    </style>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="stack"></div>
    <div id="diamond-layer"></div>

    <!-- Merkliste, dauerhaft oben links angedockt. -->
    <div id="merkliste" class="merkliste" hidden>
      <p class="merkliste__titel">Noch offen</p>
      <ul class="merkliste__liste"></ul>
    </div>

    <!-- Übersicht aller Achievements des laufenden Spiels. -->
    <div id="panel" class="panel" hidden>
      <header class="panel__kopf">
        <div>
          <h1 class="panel__spiel"></h1>
          <p class="panel__stand"></p>
        </div>
        <button class="panel__zu" type="button" title="Schließen">✕</button>
      </header>
      <div class="panel__werkzeuge">
        <input class="panel__suche" type="search" placeholder="Suchen…" spellcheck="false" />
        <div class="panel__filter" role="group">
          <button class="panel__filter-knopf" data-filter="offen">Offen</button>
          <button class="panel__filter-knopf" data-filter="erreicht">Erreicht</button>
          <button class="panel__filter-knopf" data-filter="alle">Alle</button>
        </div>
      </div>
      <ul class="panel__liste"></ul>
      <footer class="panel__fuss">
        <button class="panel__notiz-auf" type="button">+ Neuer Eintrag</button>
        <form class="panel__notiz" autocomplete="off" hidden>
          <div class="panel__arten" role="group" aria-label="Art des Eintrags">
            <button class="panel__art-knopf" type="button" data-art="notiz">Notiz</button>
            <button class="panel__art-knopf" type="button" data-art="tracker">Tracker</button>
            <button class="panel__art-knopf" type="button" data-art="abschnitt">Abschnitt</button>
          </div>
          <div class="panel__notiz-zeile">
            <input
              class="panel__notiz-feld"
              type="text"
              maxlength="90"
              placeholder="z. B. „Alle Audionotizen sammeln“"
            />
            <span class="panel__notiz-zahlen" hidden>
              <input class="panel__notiz-stand" type="number" min="0" max="99999" value="0" />
              <span class="panel__notiz-trenner">/</span>
              <input class="panel__notiz-ziel" type="number" min="1" max="99999" placeholder="52" />
            </span>
            <button class="panel__notiz-knopf" type="submit">Hinzufügen</button>
            <button class="panel__notiz-ab" type="button" title="Abbrechen">✕</button>
          </div>
        </form>
        <span class="panel__hinweis"></span>
      </footer>
    </div>
    <div id="status-badge" class="status-badge status-badge--hidden">
      <img class="status-badge__logo" src="../assets/app-icon.png" alt="" />
      <div class="status-badge__text">
        <p class="status-badge__game"></p>
        <p class="status-badge__progress"></p>
        <p class="status-badge__taste"></p>
      </div>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>

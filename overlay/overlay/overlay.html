<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
    </style>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="stack"></div>
    <!-- Bildschirmmitte. Teilen sich die Begruessung beim Start und die
         Diamant-Feier - beide sind Momente, die den Blick holen duerfen,
         und sie koennen nie gleichzeitig auftreten. -->
    <div id="mitte-layer"></div>

    <!-- Merkliste, dauerhaft oben links angedockt. -->
    <div id="merkliste" class="merkliste" hidden>
      <p class="merkliste__titel">Noch offen</p>
      <ul class="merkliste__liste"></ul>
    </div>

    <div id="status-badge" class="status-badge status-badge--hidden">
      <img class="status-badge__logo" src="../assets/app-icon.png" alt="" />
      <div class="status-badge__text">
        <p class="status-badge__game"></p>
        <p class="status-badge__progress"></p>
        <p class="status-badge__taste"></p>
      </div>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
